name: Regional catalogue (fetch)

# Stufe R: downloads breweries/beers from OpenStreetMap, Wikidata and Open Food Facts on a runner
# (stable network, polite rate limits) and uploads the raw files + the coverage report as an artifact.
# Nothing is written to the database here. Trigger: gh workflow run catalog.yml --ref <branch>
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['tools/catalog/**', '.github/workflows/catalog.yml']

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: OpenStreetMap (probe + DE/AT/CH)
        run: |
          node tools/catalog/fetch-osm.mjs
          for c in DE AT CH; do node tools/catalog/fetch-osm.mjs --country $c; done
      - name: Wikidata (probe + DE/AT/CH)
        run: |
          node tools/catalog/fetch-wikidata.mjs
          for c in DE AT CH; do node tools/catalog/fetch-wikidata.mjs --country $c; sleep 2; done
      - name: Open Food Facts (DE/AT/CH)
        # resumable per page; a second pass picks up pages a 503 interrupted
        run: |
          for c in DE AT CH; do
            node tools/catalog/fetch-off.mjs --country $c || (sleep 90 && node tools/catalog/fetch-off.mjs --country $c)
          done
      - name: Coverage report
        run: node tools/catalog/probe-report.mjs | tee tools/catalog/raw/report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-raw
          path: |
            tools/catalog/raw/*.json
            tools/catalog/raw/report.txt
          retention-days: 14
