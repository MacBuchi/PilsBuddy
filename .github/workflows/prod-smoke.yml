name: Production smoke test

# Runs the full E2E flow against the live site – after a manual deploy (npm run deploy)
# trigger it with: gh workflow run prod-smoke.yml
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL
        default: https://pilsbuddy.mcbuchi.de/
  schedule:
    - cron: '17 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright next to the flow script
        run: |
          mkdir -p /tmp/pw
          npm i --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          cp e2e/flow.mjs /tmp/pw/
      - name: Run flow against production
        run: node /tmp/pw/flow.mjs "${{ inputs.url || 'https://pilsbuddy.mcbuchi.de/' }}" /tmp/pilsbuddy
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/pilsbuddy-*.png
