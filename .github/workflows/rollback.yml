name: Rollback

# Puts an earlier release back live: deploys the dist.zip attached to that GitHub Release (exactly what was
# tested then, no rebuild) and smoke-tests it. Database migrations are NOT rolled back – an app version older
# than the live schema must still work with it (migrations only add, see CLAUDE.md).
# gh workflow run rollback.yml                      → the release before the latest
# gh workflow run rollback.yml -f tag=v2026.10.02.57
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = the one before the latest)
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4 # wrangler.jsonc
      - id: pick
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 2 --json tagName --jq '.[1].tagName // empty')
          fi
          [ -n "$TAG" ] || { echo "::error::no release to roll back to"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dist.zip
          rm -rf dist && mkdir dist && unzip -q dist.zip -d dist
          sha=$(jq -r .sha dist/version.json)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rolling back to **$TAG** (\`${sha:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
      - run: npx -y wrangler@4 deploy

  smoke:
    needs: deploy
    uses: ./.github/workflows/prod-smoke.yml
    with:
      expect_sha: ${{ needs.deploy.outputs.sha }}
