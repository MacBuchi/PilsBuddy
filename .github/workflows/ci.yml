name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  db:
    name: Database (migrations · RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase db start
      - run: supabase db lint --local --fail-on error
      - run: supabase test db

  e2e:
    name: E2E flow
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright next to the flow script
        run: |
          mkdir -p /tmp/pw
          npm i --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          cp e2e/flow.mjs /tmp/pw/
      - name: Serve build and run flow
        run: |
          npx vite preview --port 4173 --strictPort &
          npx -y wait-on@8 http://localhost:4173/
          node /tmp/pw/flow.mjs http://localhost:4173/ /tmp/pilsbuddy
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/pilsbuddy-*.png

  deploy:
    name: Deploy to Cloudflare
    needs: [e2e, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret – skipping deploy (use npm run deploy locally)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: steps.guard.outputs.enabled == 'true'
        run: npx -y wrangler@4 deploy
