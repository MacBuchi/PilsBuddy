name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR's newer push replaces the older run; on main every run finishes (deploy, smoke, release).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      # Release name of this build: date + run number – unique, no tag lookup. On main it becomes the tag.
      - id: version
        run: echo "version=v$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
      - name: Bundle size (entry chunk ≤ 260 kB gzip)
        run: node tool/bundle_size.mjs dist 260 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  db:
    name: Database (migrations · RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase db start
      - run: supabase db lint --local --fail-on error
      - run: supabase test db
      - name: Rechte wie vorgesehen (Frischinstallation)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f tool/db/grants_check.sql

  # Q1 – patch compatibility: the way production goes. Base branch's migrations on a stack with the live
  # project's old default privileges, data like live, then only the new migrations of this change; then
  # rights (grants_check.sql) and the app's own queries (schema_check.sh). Details: tool/db/upgrade_check.sh.
  upgrade:
    name: DB upgrade path (Bestand + neue Migrationen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base branch + history for the „already live“ checks
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Leeren Stack starten (ohne Migrationen)
        run: |
          mv supabase/migrations /tmp/migrations && mkdir supabase/migrations
          supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime,storage-api,edge-runtime
          rmdir supabase/migrations && mv /tmp/migrations supabase/migrations
      - name: Katalog-Fixture bauen
        run: npm run catalog:build -- --raw tools/catalog/fixtures --out /tmp/regional --min-breweries 1
      - name: Basis → Bestand → neue Migrationen → Rechte + App-Queries
        env:
          # via env, not interpolated into the script: a branch name is chosen from outside
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          CATALOG_SQL: /tmp/regional
        run: |
          # a new branch pushed has no „before“ – compare with its parent then
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = 0000000000000000000000000000000000000000 ]; then BASE_REF=HEAD~1; fi
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          SUPABASE_URL=$API_URL SUPABASE_KEY=$PUBLISHABLE_KEY BASE_REF=$BASE_REF bash tool/db/upgrade_check.sh

  sync-e2e:
    name: Backend E2E (sync · catalogue, local Supabase)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime,storage-api
      - name: Regional catalogue import (fixture, twice → idempotent)
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          npm run catalog:build -- --raw tools/catalog/fixtures --out /tmp/regional --min-breweries 1
          for _ in 1 2; do for f in /tmp/regional/*.sql; do psql "$DB_URL" -q -v ON_ERROR_STOP=1 -f "$f"; done; done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tools/catalog/fixtures/check.sql
      - uses: ./.github/actions/playwright
        with:
          scripts: e2e/sync.mjs e2e/catalog.mjs e2e/regional.mjs
      - name: Dev server against the local stack, run sync flow
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          # boot the edge runtime once (the first request after start can be slow)
          curl -s -m 60 -X POST "$API_URL/functions/v1/sync-code" -H 'content-type: application/json' -d '{"action":"redeem","code":"x"}' || true
          VITE_SUPABASE_URL=$API_URL VITE_SUPABASE_KEY=$PUBLISHABLE_KEY npx vite --port 5179 --strictPort &
          npx -y wait-on@8 http://localhost:5179/
          node /tmp/pw/sync.mjs http://localhost:5179/ /tmp/sync
      - name: Beer catalogue from the database
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f e2e/catalog-seed.sql
          node /tmp/pw/catalog.mjs http://localhost:5179/ /tmp/catalog
      - name: Regional finder (fixture catalogue, geolocation)
        run: node /tmp/pw/regional.mjs http://localhost:5179/ /tmp/regional
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-screenshots
          path: |
            /tmp/sync-*.png
            /tmp/catalog-*.png
            /tmp/regional-*.png

  e2e:
    name: E2E flow
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/playwright
        with:
          scripts: e2e/flow.mjs
      - name: Serve build and run flow
        run: |
          npx vite preview --port 4173 --strictPort &
          npx -y wait-on@8 http://localhost:4173/
          node /tmp/pw/flow.mjs http://localhost:4173/ /tmp/pilsbuddy
      # always: visual review happens on these (gh run download <run> -n screenshots), not on a local run
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/pilsbuddy-*.png
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [e2e, db, sync-e2e, upgrade]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # shared with rollback.yml: never two deploys at once
    concurrency:
      group: deploy
      cancel-in-progress: false
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret – skipping deploy (use npm run deploy locally)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: steps.guard.outputs.enabled == 'true'
        run: npx -y wrangler@4 deploy

  # After every deploy: the E2E flow against production, once it serves this commit (version.json).
  smoke:
    name: Production smoke
    needs: deploy
    if: needs.deploy.outputs.enabled == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/prod-smoke.yml
    with:
      expect_sha: ${{ github.sha }}

  # Live and smoke-tested → tag + GitHub Release (notes from the merged PRs, the built dist as asset).
  release:
    name: Release
    needs: [check, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: cd dist && zip -qr ../dist.zip .
      - name: Create release
        run: |
          gh release create "$VERSION" dist.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes
          echo "Released [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION) – live on https://pilsbuddy.mcbuchi.de" >> "$GITHUB_STEP_SUMMARY"

  # Something after the merge broke (checks on main, deploy, smoke, release): one issue, not silence.
  alert:
    name: Alert on failure
    needs: [check, db, upgrade, sync-e2e, e2e, deploy, smoke, release]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/release_alert.sh "Release ${{ needs.check.outputs.version }} fehlgeschlagen"
