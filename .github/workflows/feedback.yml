name: Feedback Bot

# Turns in-app feedback („Wünsch dir was!“, table public.feedback) into public GitHub issues and deletes
# processed rows after 30 days (tool/feedback_bot.py). Without SUPABASE_SERVICE_ROLE_KEY the run says so
# in its summary and stays green – a run that fails every two hours would only be noise.
on:
  schedule:
    - cron: "23 */2 * * *" # every two hours
  workflow_dispatch:

# two overlapping runs would read the same rows – let the second wait
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  process:
    name: Feedback verarbeiten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (no network)
        run: python3 tool/feedback_bot.py --self-test
      - name: Key present?
        id: key
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: echo "have=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: No key, no run
        if: steps.key.outputs.have == 'false'
        run: |
          {
            echo "### Feedback-Bot übersprungen – \`SUPABASE_SERVICE_ROLE_KEY\` fehlt"
            echo ""
            echo "Supabase → Project Settings → API Keys → Secret key (sb_secret_…) → GitHub → Settings → Secrets → Actions."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Feedback → issues
        if: steps.key.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tool/feedback_bot.py
