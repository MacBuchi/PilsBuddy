name: Playwright
description: >
  Installs Playwright + Chromium into /tmp/pw (not a project dependency, see e2e/README.md) and copies the
  given e2e scripts next to it – ES module imports need node_modules/playwright beside the script.
inputs:
  scripts:
    description: Space-separated e2e scripts to copy into /tmp/pw
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-1.56.1-${{ runner.os }}
    - shell: bash
      run: |
        mkdir -p /tmp/pw
        npm i --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1
        if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
          npx --prefix /tmp/pw playwright install-deps chromium
        else
          npx --prefix /tmp/pw playwright install --with-deps chromium
        fi
        cp ${{ inputs.scripts }} /tmp/pw/
